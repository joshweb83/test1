<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 재미있는 테트리스 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 게임 전체를 감싸는 큰 상자 -->
    <div class="game-container">

        <!-- 게임 제목 -->
        <h1>TETRIS</h1>

        <!-- 게임 정보 (점수, 레벨) -->
        <div class="game-info">
            <div class="info-box">
                <h3>점수</h3>
                <div id="score">0</div>
            </div>
            <div class="info-box">
                <h3>레벨</h3>
                <div id="level">1</div>
            </div>
            <div class="info-box">
                <h3>없앤 줄</h3>
                <div id="lines">0</div>
            </div>
        </div>

        <!-- 게임 버튼들 -->
        <div class="controls">
            <button id="startBtn" onclick="startGame()">START</button>
            <button id="pauseBtn" onclick="pauseGame()">PAUSE</button>
        </div>

        <!-- 게임판 (블록이 떨어지는 곳) -->
        <canvas id="tetris"></canvas>

        <!-- 모바일 터치 컨트롤 -->
        <div class="mobile-controls">
            <div class="control-row">
                <button class="touch-btn rotate-btn" id="rotateBtn">↻</button>
            </div>
            <div class="control-row">
                <button class="touch-btn" id="leftBtn">←</button>
                <button class="touch-btn" id="downBtn">↓</button>
                <button class="touch-btn" id="rightBtn">→</button>
            </div>
            <div class="control-row">
                <button class="touch-btn drop-btn" id="dropBtn">DROP</button>
            </div>
        </div>

        <!-- 게임 조작 방법 설명 -->
        <div class="instructions">
            <h3>CONTROLS</h3>
            <p>← LEFT : Move Left</p>
            <p>→ RIGHT : Move Right</p>
            <p>↓ DOWN : Soft Drop</p>
            <p>↑ UP : Rotate</p>
            <p>SPACE : Hard Drop</p>
        </div>

    </div>

    <!-- 자바스크립트 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
